[package]
name = "tore-diagnostics-native"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", default-features = false, features = ["std", "NSString", "NSThread"] }
objc2-app-kit = { version = "0.2.2", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSResponder"] }

# This small native boundary audits its OS calls; the application forbids unsafe.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
