[package]
name = "tore-input-native"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tore-input = { path = "../tore-input" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Gaming_Input", "Foundation_Collections", "Win32_System_WinRT"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSEnumerator", "NSError", "NSSet", "NSString"] }
objc2-game-controller = { version = "0.3.2", default-features = false, features = ["std", "GCController", "GCDevice", "GCPhysicalInputProfile", "GCControllerElement", "GCControllerAxisInput", "GCControllerButtonInput", "GCDeviceHaptics", "dispatch2"] }
objc2-core-haptics = { version = "0.3.2", default-features = false, features = ["std", "CHHapticEngine", "CHHapticEvent", "CHHapticParameter", "CHHapticPattern", "CHHapticPatternPlayer", "block2"] }
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }

# Native input and diagnostics boundaries permit audited OS calls.
# Application, simulation and format crates forbid unsafe.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
