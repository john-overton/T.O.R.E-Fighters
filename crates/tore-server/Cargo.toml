[package]
name = "tore-server"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# Stamps the build's commit and target the way tore-app's build script does.
build = "build.rs"

[dependencies]
tore-import = { path = "../tore-import" }
tore-net = { path = "../tore-net" }
tore-realtime-native = { path = "../tore-realtime-native" }
tore-session = { path = "../tore-session" }
tore-world = { path = "../tore-world" }

[dev-dependencies]
# The master server, for the listing's end-to-end tests.
tore-master = { path = "../tore-master" }
tore-sim = { path = "../tore-sim" }
tore-world = { path = "../tore-world", features = ["test-support"] }

[lints]
workspace = true
