# A starting configuration for tore-server. Every value below is the
# server's own default, so this file runs exactly as having no file does;
# change what you need. One setting per line, a name and a value; `#` starts
# a comment. Every setting is described in DEDICATED-SERVER.md, "The
# configuration file".
#
# Run it from this folder with:
#   tore-server --config server.conf

# Shown to joining players and in the Internet Lobby.
name T.O.R.E server

# The UDP port. Forward it on your router for players on the internet.
port 26900

# Players at once, 1 to 30.
max-players 30

# The mission file, relative to this file. mission.txt beside it is a
# starting point; DEDICATED-SERVER.md, "The mission file", has every line.
mission mission.txt

# `first-player` waits in the lobby until the first player is ready; `now`
# flies at once.
start first-player

# `on` lists this server on the Internet Lobby. Off, players join by address
# or find it on their local network.
broadcast off

# `on` asks your router to forward the port (UPnP, NAT-PMP or PCP).
port-mapping off

# Uncomment to require a password. It crosses the network as plain text.
# password changeme
