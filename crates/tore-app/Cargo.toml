[package]
name = "tore-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# Embeds assets/icon/tore.ico as the executable icon on windows-msvc.
# It is a no-op on every other target.
build = "build.rs"

[dependencies]
tore-input = { path = "../tore-input" }
tore-input-native = { path = "../tore-input-native" }
tore-sim = { path = "../tore-sim" }
cpal = "0.16"
tore-formats = { path = "../tore-formats" }
pollster = "0.4"
wgpu = { version = "27.0.1", default-features = false, features = ["std", "parking_lot", "metal", "dx12", "vulkan", "gles", "wgsl"] }
winit = "0.30.12"

[lints]
workspace = true
