[package]
name = "tore-session"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# Stamps the build's commit for the tore-bot binary.
build = "build.rs"

[[bin]]
name = "tore-bot"
path = "src/bin/tore-bot.rs"

[dependencies]
tore-codec = { path = "../tore-codec" }
tore-formats = { path = "../tore-formats" }
tore-import = { path = "../tore-import" }
tore-input = { path = "../tore-input" }
tore-net = { path = "../tore-net" }
tore-sim = { path = "../tore-sim" }
tore-world = { path = "../tore-world" }
tore-workers = { path = "../tore-workers" }

[dev-dependencies]
tore-world = { path = "../tore-world", features = ["test-support"] }
tore-workers = { path = "../tore-workers", features = ["test-support"] }

[lints]
workspace = true
