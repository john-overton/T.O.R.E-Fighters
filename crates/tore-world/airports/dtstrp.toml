# T.O.R.E redrawn airport plan: DTSTRP.OT (DTSTRP.SH, 22 vertical pads). Experiment AP1, 2026-10-10.
#
# Opinionated (John, 2026-10-10: redraw the airports at real size from retail
# airport textures; one plan per runway shape type; larger airports keep
# their strips, with parking and taxiways on both sides). Sizes and positions
# are agent choices at real-world scale (fitted); runway centrelines follow
# the retail ones. The default; TORE_REDRAWN_AIRPORTS=0 turns it off.
# Feet in the runway frame: x right of the retail runway centreline, z along
# it from its near threshold (STRIP anchor 0x11). Keys:
# docs/formats/redrawn-airports.md.

applies_to = "DTSTRP.OT"
runway_length_ft = 1074
grass_margin_ft = 60
# A dirt strip: no lights (slice CL-AP, 2026-10-11).
lights = false

[[material]]
name = "runway_plain"
pic = "_DTSTRP.PIC"
rect = [1, 3, 85, 87]
tile_ft = [0, 90]

[[material]]
name = "runway_centreline"
pic = "_DTSTRP.PIC"
rect = [1, 3, 85, 87]
tile_ft = [0, 90]

[[material]]
name = "runway_touchdown"
pic = "_DTSTRP.PIC"
rect = [1, 3, 85, 87]
tile_ft = [0, 90]

[[material]]
name = "runway_threshold"
pic = "_DTSTRP.PIC"
rect = [1, 3, 85, 87]
tile_ft = [0, 150]

[[runway]]
name = "R0"
from = [0, 0]
length = 1074
width = 75
pad = 0
touchdown = 0
numbers = false

# The dirt hardstand beside the strip, as long as the retail strip's parking
# column: the helicopter templates (Cuba QCCMHQ, Panama QAPHELO, Gulf
# QPGSRUN) park their helicopters 252 ft right of the centre line from 220
# to 720 ft along, which stood on the grass beside the old 200 ft pad (slice
# CL-AP, 2026-10-11, agent). Drawn in the strip's own dirt.
[[material]]
name = "apron"
pic = "_DTSTRP.PIC"
rect = [1, 3, 85, 87]
tile_ft = [90, 90]

[[apron]]
name = "hardstand"
min = [80, 150]
max = [320, 800]
