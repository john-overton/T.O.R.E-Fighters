# T.O.R.E redrawn airport plan: STRIP3A.OT (RNWY3A.SH, the north tile of STRIP3 fields). Experiment AP1, 2026-10-10.
#
# Opinionated (John, 2026-10-10: redraw the airports at real size from retail
# airport textures; one plan per runway shape type; larger airports keep
# their strips, with parking and taxiways on both sides). Sizes and positions
# are agent choices at real-world scale (fitted); runway centrelines follow
# the retail ones. Only applies with TORE_REDRAWN_AIRPORTS=1.
# Feet in the runway frame: x right of the retail runway centreline, z along
# it from its near threshold (STRIP anchor 0x11). Keys:
# docs/formats/redrawn-airports.md.

