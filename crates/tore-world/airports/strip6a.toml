# AI points (slice CL-AP, 2026-10-11, agent: John asked that the AI taxi on
# taxiways, not grass): the base plans' pattern turned to this tile's main
# runway. A cross taxiway 190 ft behind its near threshold (a 220 ft paved
# pad), the parallel taxiway on its left, an apron for the nine parking slots
# beside it, and a cross taxiway 250 ft before its far end. Coordinates are
# in the tile's frame; parking_heading is against the frame.
