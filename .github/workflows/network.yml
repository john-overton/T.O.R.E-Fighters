name: Network loopback

# A host and two bots over real UDP on the loopback interface (stage D, slice
# D10), on every platform the game runs on. The host runs in the test process;
# the bots are the real tore-bot program, each loading a synthetic import the
# test writes (tore-world's test fixtures), so no retail data is needed. The
# job fails on any refusal, fault, drop or bot that does not exit cleanly. The
# network simulator matrix is part of the normal test suite (ci.yml); its full
# five-minute form is an ignored test run by hand before a release.
#
# The strict-real-time job runs the strict forms of the game's real-time
# hosting tests (slice EF-Y), ignored in the normal suite, one at a time on
# Linux, whose sleeps are accurate: no correction or mismatch of the hosting
# player's plane, a window stall's tick count and snapshot gaps to 150 ms.
# The normal suite runs forms that a starved macOS or 32-bit Windows runner
# meets (docs/ARCHITECTURE.md, "Real-time tests on shared runners").

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  loopback:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup show
      - name: A host and two bots over loopback UDP
        shell: bash
        env:
          TORE_LOOPBACK_SECONDS: '20'
          TORE_WORKERS: '2'
        run: cargo test --locked -p tore-session --test loopback -- --nocapture

  strict-real-time:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux windowing libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libasound2-dev pkg-config
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup show
      - name: Build the game's tests
        run: cargo test --locked -p tore-app --bin tore-app --no-run
      # --exact runs nothing for a misspelt name, so the count is checked.
      - name: The strict real-time tests, one at a time
        shell: bash
        env:
          TORE_WORKERS: '2'
        run: |
          set -o pipefail
          cargo test --locked -p tore-app --bin tore-app -- \
            --ignored --exact --test-threads=1 --nocapture \
            net::hosting::tests::a_hosted_mission_flies_with_no_correction_at_all \
            net::hosting::tests::a_two_second_window_stall_stalls_nobody_strictly \
            net::hosting::tests::an_eight_second_window_stall_drops_nobody_and_the_king_still_reigns_strictly \
            net::lookup::tests::a_name_the_system_cannot_resolve_fails \
            2>&1 | tee strict.log
          grep -q "test result: ok. 4 passed" strict.log
