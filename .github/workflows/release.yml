name: Release packages

# Tag-triggered. A push to a release-test/... branch, or workflow_dispatch,
# exercises the packaging path without publishing anything: the release job
# only runs for a tag. Nothing built here is signed.

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release-test/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        # The same four images as ci.yml. macos-14 is Apple Silicon;
        # macos-15-intel is the last x86_64 macOS image GitHub will offer.
        os: [macos-14, macos-15-intel, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # The packaging scripts fall back to `git describe`.
      - name: Install Linux windowing libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libasound2-dev pkg-config
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup show
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # The same gates ci.yml runs, so a tag cannot ship something the baseline
      # would have rejected.
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      # Discovery includes test_build_resources.py, which executes the build.rs
      # Windows message-resource test that cargo test does not discover.
      - name: Test tooling and Windows resource layout
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Check source assets
        run: python tools/check_assets.py
      - name: Check documentation headers
        run: python tools/check_docs.py

      # A tag must match the crate version so the app, the package names and
      # the release all say the same thing.
      - name: Check the tag against Cargo.toml
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          crate=$(grep -m1 '^version' crates/tore-app/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "Tag v$tag does not match crates/tore-app/Cargo.toml version $crate" >&2
            exit 1
          fi
      - name: Stamp the build version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(git describe --tags --always)"
          fi
          echo "TORE_BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "Build version $version"
      - name: Build release binaries
        run: cargo build --release --locked -p tore-app -p tore-extract
      - name: Check release binaries
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python tools/check_assets.py target/release/tore-app.exe
            python tools/check_assets.py target/release/tore-extract.exe
          else
            python tools/check_assets.py target/release/tore-app
            python tools/check_assets.py target/release/tore-extract
          fi

      - name: Enforce runtime library dependencies
        shell: bash
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          python tools/check_runtime_dependencies.py "target/release/tore-app$suffix" "target/release/tore-extract$suffix"
      - name: Collect matching debug symbols
        shell: bash
        run: |
          mkdir -p dist/symbols
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/tore_app.pdb target/release/tore_extract.pdb dist/symbols/
          elif [ "$RUNNER_OS" = "macOS" ]; then
            for binary in tore-app tore-extract; do
              dsymutil "target/release/$binary" -o "dist/symbols/$binary.dSYM"
            done
          else
            for binary in tore-app tore-extract; do
              objcopy --only-keep-debug "target/release/$binary" "dist/symbols/$binary.debug"
            done
          fi
          git rev-parse HEAD > dist/symbols/commit.txt
          echo "$TORE_BUILD_VERSION" > dist/symbols/version.txt
      - name: Upload matching debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ matrix.os }}-${{ github.sha }}
          if-no-files-found: error
          path: dist/symbols/

      # Each script stages a bundle directory, scans it with check_assets.py,
      # builds the package, and scans the finished package too. The
      # application icon is not generated here: the PNG set and tore.ico are
      # committed under crates/tore-app/assets/icon/, so no runner needs
      # ImageMagick. The Windows script passes -ext WixUtilExtension to candle
      # and light for the exit dialog's launch checkbox; it ships with the
      # WiX 3.14 install on the windows-2022 image alongside WixUIExtension.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tools/package/package-linux.sh
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: tools/package/package-macos.sh
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/package/package-windows.ps1

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.dmg
            dist/*.msi

  release:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: List packages
        run: ls -l dist
      - name: Check every package again before publishing
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No packages were downloaded." >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            python tools/check_assets.py "$file"
          done
      - name: Publish to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --prerelease \
              --notes "Unsigned pre-release builds. On macOS the first launch is right-click, Open. On Windows SmartScreen, choose More info, then Run anyway. No retail media is included: point the app at your own Fighters Anthology copy on first run."
          fi
          gh release upload "$TAG" dist/* --clobber
