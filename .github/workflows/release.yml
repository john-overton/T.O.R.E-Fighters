name: Release packages

# Tag-triggered. A push to a release-test/... branch, or workflow_dispatch,
# exercises the packaging path without publishing anything: the release job
# only runs for a tag. macOS code is ad-hoc signed for integrity only;
# there is no Developer ID signing or notarization.

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release-test/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version for a test package (e.g. 0.2.2-rc.1); empty uses git describe'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        # The same four jobs as ci.yml. macos-14 is Apple Silicon;
        # macos-15-intel is the last x86_64 macOS image GitHub will offer. The
        # Linux build uses the player's own glibc, so it runs on the oldest
        # supported Ubuntu LTS: a newer host makes a binary that will not start
        # on older distributions. There is no 32-bit Windows package since
        # 2026-10-25 (John). An entry may still name a `target` to cross-build;
        # such a job skips the dedicated server.
        include:
          - os: macos-14
          - os: macos-15-intel
          - os: ubuntu-22.04
          - os: windows-2022
    # TORE_SELF_HOSTED, a repository variable, lists the platforms that run on
    # the project's own machines instead of GitHub's (docs/CI-RUNNERS.md).
    runs-on: ${{ contains(vars.TORE_SELF_HOSTED, matrix.os) && fromJSON(format('["self-hosted","tore-{0}"]', matrix.os)) || matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # The packaging scripts fall back to `git describe`.
          clean: false
      # clean: false and the step after it keep cargo's target folder on a
      # self-hosted runner, so its builds are incremental; everything else
      # untracked goes, as checkout's own clean would remove it.
      - name: Clean the checkout, keeping cargo's target folder
        shell: bash
        run: git clean -ffdx -e /target/
      - name: Install Linux windowing libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libasound2-dev pkg-config
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup show
      # Every cargo command below then lints, tests and builds for that
      # target, writing to target/<target>/ instead of target/.
      - name: Add the Rust target
        if: matrix.target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add "$TARGET"
          echo "CARGO_BUILD_TARGET=$TARGET" >> "$GITHUB_ENV"
      # A self-hosted Mac brings its own Python 3.14 (tools/ci-runners/macos/setup.sh):
      # setup-python's macOS builds need sudo to install.
      - uses: actions/setup-python@v7
        if: runner.environment != 'self-hosted' || runner.os != 'macOS'
        with:
          python-version: '3.14'

      # The same gates ci.yml runs, so a tag cannot ship something the baseline
      # would have rejected.
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      # Discovery includes test_build_resources.py, which executes the build.rs
      # Windows message-resource test that cargo test does not discover.
      - name: Test tooling and Windows resource layout
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Check source assets
        run: python tools/check_assets.py
      - name: Check documentation headers
        run: python tools/check_docs.py

      # A tag must match the crate version so the app, the package names and
      # the release all say the same thing.
      - name: Check the tag against Cargo.toml
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          crate=$(grep -m1 '^version' crates/tore-app/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "Tag v$tag does not match crates/tore-app/Cargo.toml version $crate" >&2
            exit 1
          fi
      - name: Stamp the build version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="$(git describe --tags --always)"
          fi
          echo "TORE_BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "Build version $version"
      - name: Build release binaries
        run: cargo build --release --locked -p tore-app -p tore-extract
      # The dedicated server (docs/DEDICATED-SERVER.md) ships as its own
      # archive for Windows x86_64, both macOS architectures and Linux; a
      # cross-target job does not build it. It is a cargo command of
      # its own because one command for both would unify their dependencies'
      # features, which could change the game's binaries.
      - name: Build the dedicated server
        if: ${{ !matrix.target }}
        run: cargo build --release --locked -p tore-server
      - name: Check release binaries
        shell: bash
        run: |
          out="target/${CARGO_BUILD_TARGET:+$CARGO_BUILD_TARGET/}release"
          if [ "$RUNNER_OS" = "Windows" ]; then
            python tools/check_assets.py "$out/tore-app.exe"
            python tools/check_assets.py "$out/tore-extract.exe"
          else
            python tools/check_assets.py "$out/tore-app"
            python tools/check_assets.py "$out/tore-extract"
          fi

      - name: Enforce runtime library dependencies
        shell: bash
        run: |
          out="target/${CARGO_BUILD_TARGET:+$CARGO_BUILD_TARGET/}release"
          suffix=""
          floor=()
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          # Ubuntu 22.04's glibc, the release floor for Linux.
          if [ "$RUNNER_OS" = "Linux" ]; then floor=(--max-glibc 2.35); fi
          python tools/check_runtime_dependencies.py "${floor[@]}" "$out/tore-app$suffix" "$out/tore-extract$suffix"
      - name: Collect matching debug symbols
        shell: bash
        run: |
          out="target/${CARGO_BUILD_TARGET:+$CARGO_BUILD_TARGET/}release"
          mkdir -p dist/symbols
          binaries=(tore-app tore-extract)
          # The dedicated server, where this job built it (above).
          if [ -z "${CARGO_BUILD_TARGET:-}" ]; then binaries+=(tore-server); fi
          for binary in "${binaries[@]}"; do
            if [ "$RUNNER_OS" = "Windows" ]; then
              cp "$out/${binary//-/_}.pdb" dist/symbols/
            elif [ "$RUNNER_OS" = "macOS" ]; then
              dsymutil "$out/$binary" -o "dist/symbols/$binary.dSYM"
            else
              objcopy --only-keep-debug "$out/$binary" "dist/symbols/$binary.debug"
            fi
          done
          git rev-parse HEAD > dist/symbols/commit.txt
          echo "$TORE_BUILD_VERSION" > dist/symbols/version.txt
      - name: Upload matching debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ matrix.os }}${{ matrix.target && format('-{0}', matrix.target) || '' }}-${{ github.sha }}
          if-no-files-found: error
          path: dist/symbols/

      # Each script stages a bundle directory, scans it with check_assets.py,
      # builds the package, and scans the finished package too. The
      # application icon is not generated here: the PNG set and tore.ico are
      # committed under crates/tore-app/assets/icon/, so no runner needs
      # ImageMagick. The Windows script passes -ext WixUtilExtension to candle
      # and light for the exit dialog's launch checkbox; it ships with the
      # WiX 3.14 install on the windows-2022 image alongside WixUIExtension.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tools/package/package-linux.sh
      # The script requires a bundle seal and strict signature verification
      # both before packaging and inside the mounted DMG. Any failure stops CI.
      - name: Package and verify ad-hoc signatures (macOS)
        if: runner.os == 'macOS'
        run: tools/package/package-macos.sh
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/package/package-windows.ps1

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}${{ matrix.target && format('-{0}', matrix.target) || '' }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.dmg
            dist/*.msi

      # tools/package/package_server.py stages the server with its guide, the
      # license, the third-party notices and the sample server.conf and
      # mission.txt; runs check_assets.py, check_runtime_dependencies.py (with
      # the 2.35 glibc floor on Linux) and `tore-server --version`, which must
      # print the stamped version; writes tore-server-<version>-<platform>
      # (.tar.gz, or .zip on Windows) and its .sha256 into dist/server/; then
      # scans the archive and runs `--version` again from an unpacked copy.
      # dist/server/ keeps it out of the packages-* upload above. macOS also
      # signs ad hoc and verifies the staged and unpacked server.
      - name: Package the dedicated server
        if: ${{ !matrix.target }}
        shell: bash
        run: |
          floor=()
          if [ "$RUNNER_OS" = "Linux" ]; then floor=(--max-glibc 2.35); fi
          python tools/package/package_server.py --version "$TORE_BUILD_VERSION" "${floor[@]}"
      - name: Upload the dedicated server
        if: ${{ !matrix.target }}
        uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.os }}
          if-no-files-found: error
          path: dist/server/

      # The master server (docs/MASTER-SERVER.md) is a Linux program, so only
      # the Linux job builds it. It builds on the same Ubuntu 22.04 runner as
      # the game's Linux package, so its glibc floor is the same (2.35) and it
      # runs on any current long-term Ubuntu. It is its own artifact, kept out
      # of the game's packages-* artifact, and lands in dist/master/ so the
      # packages upload above (dist/*.tar.gz) never picks it up twice.
      - name: Build the master server (Linux)
        if: runner.os == 'Linux'
        run: cargo build --release --locked -p tore-master
      - name: Check the master server (Linux)
        if: runner.os == 'Linux'
        run: |
          python tools/check_assets.py target/release/tore-master
          python tools/check_runtime_dependencies.py --max-glibc 2.35 target/release/tore-master
          target/release/tore-master --version
      - name: Package the master server (Linux)
        if: runner.os == 'Linux'
        run: |
          name="tore-master-${TORE_BUILD_VERSION}-linux-x86_64"
          stage="dist/stage/master/$name"
          rm -rf "$stage"
          mkdir -p "$stage" dist/master
          install -m 755 target/release/tore-master "$stage/tore-master"
          install -m 644 LICENSE "$stage/LICENSE"
          install -m 644 THIRD_PARTY_NOTICES.md "$stage/THIRD_PARTY_NOTICES.md"
          install -m 644 docs/MASTER-SERVER.md "$stage/MASTER-SERVER.md"
          tar -czf "dist/master/$name.tar.gz" -C "$(dirname "$stage")" "$name"
          (cd dist/master && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          python tools/check_assets.py "dist/master/$name.tar.gz"
          ls -l dist/master
      - name: Upload the master server (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: master-${{ matrix.os }}
          if-no-files-found: error
          path: dist/master/

  release:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      # The Linux master server is its own artifact (master-*), published
      # beside the game's packages under the same tag.
      - name: Download the master server
        uses: actions/download-artifact@v8
        with:
          pattern: master-*
          merge-multiple: true
          path: dist
      # The dedicated server's archives (server-*), one per platform.
      - name: Download the dedicated server
        uses: actions/download-artifact@v8
        with:
          pattern: server-*
          merge-multiple: true
          path: dist
      - name: List packages
        run: ls -l dist
      - name: Check every package again before publishing
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No packages were downloaded." >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            python tools/check_assets.py "$file"
          done
      - name: Publish to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          # The tag's notes in docs/release/ become the release title and
          # description, with relative links made absolute. Without a notes
          # file, a short generic note.
          notes="docs/release/$TAG.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f "$notes" ]; then
              title=$(python tools/release_notes.py "$notes" --title)
              python tools/release_notes.py "$notes" --body --ref "$TAG" > "$RUNNER_TEMP/release-notes.md"
              gh release create "$TAG" \
                --title "$title" \
                --prerelease \
                --notes-file "$RUNNER_TEMP/release-notes.md"
            else
              gh release create "$TAG" \
                --title "$TAG" \
                --prerelease \
                --notes "Pre-release builds without developer signing or notarization. On macOS, open the app, then if blocked use System Settings > Privacy & Security > Open Anyway. On Windows SmartScreen, choose More info, then Run anyway. No retail media is included: point the app at your own Fighters Anthology copy on first run."
            fi
          fi
          gh release upload "$TAG" dist/* --clobber
