name: Rust baseline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is Apple Silicon; macos-15-intel is the last x86_64 macOS image
        # GitHub will offer, retiring August 2027. After that, Intel Mac coverage
        # means cross-compiling x86_64-apple-darwin from an arm64 runner. The
        # second windows-2022 job checks the 32-bit Windows build. Every job is
        # its own include entry: a plain os list would merge the 32-bit entry
        # into the 64-bit Windows job instead of adding one. Linux builds on
        # ubuntu-22.04, the release floor, so CI tests what ships.
        include:
          - os: macos-14
          - os: macos-15-intel
          - os: ubuntu-22.04
          - os: windows-2022
          - os: windows-2022
            target: i686-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux windowing libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libasound2-dev pkg-config
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup show
      # Every cargo command below then lints, tests and builds for that
      # target, writing to target/<target>/ instead of target/.
      - name: Add the Rust target
        if: matrix.target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add "$TARGET"
          echo "CARGO_BUILD_TARGET=$TARGET" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        # Small hosted runners otherwise select the serial fallback. Exercise
        # the production pool as well as explicit executor equivalence tests.
        env:
          TORE_WORKERS: '2'
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --locked
      # Discovery includes test_build_resources.py, which executes the build.rs
      # Windows message-resource test that cargo test does not discover.
      - name: Test tooling and Windows resource layout
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Check source assets
        run: python tools/check_assets.py
      - name: Check documentation headers
        run: python tools/check_docs.py
      - name: Check executable assets
        shell: bash
        run: |
          out="target/${CARGO_BUILD_TARGET:+$CARGO_BUILD_TARGET/}debug"
          if [ "$RUNNER_OS" = "Windows" ]; then
            python tools/check_assets.py "$out/tore-app.exe"
            python tools/check_assets.py "$out/tore-extract.exe"
          else
            python tools/check_assets.py "$out/tore-app"
            python tools/check_assets.py "$out/tore-extract"
          fi
      - name: Check startup diagnostics and runtime libraries
        shell: bash
        run: |
          out="target/${CARGO_BUILD_TARGET:+$CARGO_BUILD_TARGET/}debug"
          suffix=""
          floor=()
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          # Ubuntu 22.04's glibc, the release floor for Linux.
          if [ "$RUNNER_OS" = "Linux" ]; then floor=(--max-glibc 2.35); fi
          python tools/check_startup_diagnostics.py "$out/tore-app$suffix"
          python tools/check_runtime_dependencies.py "${floor[@]}" "$out/tore-app$suffix" "$out/tore-extract$suffix"
