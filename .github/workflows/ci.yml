name: Rust baseline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is Apple Silicon; macos-15-intel is the last x86_64 macOS image
        # GitHub will offer, retiring August 2027. After that, Intel Mac coverage
        # means cross-compiling x86_64-apple-darwin from an arm64 runner.
        os: [macos-14, macos-15-intel, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux windowing libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libasound2-dev pkg-config
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup show
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --locked
      # Discovery includes test_build_resources.py, which executes the build.rs
      # Windows message-resource test that cargo test does not discover.
      - name: Test tooling and Windows resource layout
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Check source assets
        run: python tools/check_assets.py
      - name: Check documentation headers
        run: python tools/check_docs.py
      - name: Check executable assets
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python tools/check_assets.py target/debug/tore-app.exe
            python tools/check_assets.py target/debug/tore-extract.exe
          else
            python tools/check_assets.py target/debug/tore-app
            python tools/check_assets.py target/debug/tore-extract
          fi
      - name: Check startup diagnostics and runtime libraries
        shell: bash
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          python tools/check_startup_diagnostics.py "target/debug/tore-app$suffix"
          python tools/check_runtime_dependencies.py "target/debug/tore-app$suffix" "target/debug/tore-extract$suffix"
