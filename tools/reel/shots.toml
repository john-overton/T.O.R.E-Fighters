# The 32-second edit. Every cut after the boot lands on a beat of the grid:
# frame 90 + 25.2196 * beats. `vcrop` is the portrait crop centre (0..1 of the
# landscape width) at shot frames; portrait text stays in its central square.
[[shot]]
id = "boot"
layout = "boot"
start = 0
frames = 90
clips = []
transition = "power-on"

[[shot]]
id = "launch"
layout = "full"
start = 90
frames = 202
clips = ["launch"]
transition = "flash"
vcrop = [[0, 0.40], [100, 0.46], [201, 0.52]]

[[shot]]
id = "formation"
layout = "full"
start = 292
frames = 75
clips = ["formation"]
transition = "wobble"
bloom = 0.3
vcrop = [[0, 0.62], [74, 0.62]]

[[shot]]
id = "formation-break"
layout = "full"
start = 367
frames = 76
clips = ["formation-break"]
transition = "cut"
vcrop = [[0, 0.46], [75, 0.50]]

[[shot]]
id = "hero-f14"
layout = "aircraft"
start = 443
frames = 126
clips = ["hero-f14"]
overlay = "F-14D TOMCAT"
transition = "wobble"
vcrop = [[0, 0.40], [125, 0.42]]
vzoom = 1.32

[[shot]]
id = "hero-rafale"
layout = "aircraft"
start = 569
frames = 126
clips = ["hero-rafale"]
overlay = "RAFALE C"
transition = "cut"
vcrop = [[0, 0.38], [125, 0.42]]
vzoom = 1.32

[[shot]]
id = "vista-gre"
layout = "theater"
start = 695
frames = 126
clips = ["vista-GRE"]
overlay = "GREECE"
transition = "wobble"
vcrop = [[0, 0.40], [125, 0.42]]
vzoom = 1.12

[[shot]]
id = "vista-tviet"
layout = "theater"
start = 821
frames = 101
clips = ["vista-TVIET"]
overlay = "NORTH VIETNAM"
transition = "cut"
