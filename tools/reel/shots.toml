# First Flight reel, second pass: the production recipe.
#
# Every gameplay picture is an exact recorded tick drawn by the engine. Edit
# cameras, clocks and the edit here; render.sh rebuilds everything from it.
#
# Units: camera keys are feet in the anchor aircraft's heading frame (X right,
# Y up, Z forward); `fov` is vertical degrees. Key frames count output frames
# from the start of a capture. `interp = "pchip"` passes smoothly through every
# key; "smoothstep" eases in and out of each key, which holds when two keys
# match. FOV always interpolates in zoom space, so a pullback reads evenly.
# `eye_tick` fixes the eye where the anchor's frame was at that tick while the
# look target keeps following the anchor.

[reel]
fps = 60
width = 1920
height = 1080
duration = 32
repo = "github.com/john-overton/T.O.R.E-Fighters"
stills = [190, 420, 520, 640, 1040, 1135, 1460, 1760]
aircraft_roster = ["F/A-18D HORNET", "RAFALE C", "F-14D TOMCAT", "A-4E SKYHAWK", "X-31 EFM", "MiG-29 FULCRUM-C", "Su-27 FLANKER-B", "MiG-21 FISHBED", "Su-25 FROGFOOT-A", "MiG-23 FLOGGER-B", "Su-35", "F-22A RAPTOR", "F-22N RAPTOR", "F/A-XX (CONCEPT)"]
theater_roster = ["PANAMA", "THE BALTICS", "CUBA", "EGYPT", "FRANCE", "GREECE", "IRAQ", "KURIL ISLANDS", "FALKLAND ISLANDS", "NORTH/SOUTH KOREA", "PERSIAN GULF", "PAKISTAN", "NORTH VIETNAM", "UKRAINE", "VLADIVOSTOK", "TAIWAN"]

# Retail score phrases, exported at render time by --reel-music. Tempo, beat
# and loudness figures are this production's measurements of the rendered PCM.
[music]
# Every cut after the boot lands on a beat of this grid, counted from the
# launch downbeat.
grid_bpm = 142.72
downbeat_frame = 90
# The bed: briefing track XFI204CA, picked by John on 2026-09-30. Its pitch-
# preserving stretch onto the grid moves it 3.2 % faster. Its first downbeat
# lands on the launch; its pickup hit sounds just before it, under the boot.
bed = "XFI204CA.11K"
bed_bpm = 138.34
bed_first_beat = 0.400
bed_entry_bar = 0
stretch_bed = true
# Loudness matched to the first cut's bed (AIR006 at -13.1 LUFS).
bed_gain_db = -3.25
# The ending, also John's pick: AIR003 from the mission-success score kicks in
# on the first frame of `kick_shot`, from its bar 1, plays the whole bars that
# fit, then splices into the phrase's own final stinger and rings out.
ending = "AIR003.11K"
ending_bpm = 142.0
ending_first_beat = 0.015
ending_kick_bar = 1
ending_stinger = 23.679
ending_gain_db = 0.43
kick_shot = "replay-impact"
level = 0.4
duck_db = 12.0
# Lighter under the call that overlaps the kick, so the kick keeps its punch.
ending_duck_db = 6.0
# Retail cockpit recordings used as editorial Foley on the boot screen.
effects = ["&SWITCH.11K", "&BUTTON.11K"]

