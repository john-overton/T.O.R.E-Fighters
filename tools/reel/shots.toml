# Tape treatment holds to `tape[0]`, then fades out by `tape[1]` while the
# engine zoom pulls back into the cockpit.
[[shot]]
id = "cockpit"
layout = "cockpit"
start = 1099
frames = 302
clips = ["cockpit"]
transition = "tape"
tape = [76, 151]
vcrop = [[0, 0.5], [301, 0.5]]

# The missile's explosion reaches this camera eight frames after its flash, as
# the game delays sound with distance. The edit advances this shot's sound by
# six frames and lets the blast ring on over the paused frame.
[[shot]]
id = "replay-alt"
layout = "replay"
start = 1401
frames = 51
clips = ["replay-alt"]
transition = "wobble"
audio_offset = 6
audio_tail = 40

[[shot]]
id = "replay-freeze"
layout = "replay"
start = 1452
frames = 25
clips = ["replay-freeze"]
transition = "cut"

[[shot]]
id = "replay-rewind"
layout = "replay"
start = 1477
frames = 25
clips = ["replay-rewind"]
transition = "cut"

[[shot]]
id = "replay-impact"
layout = "replay"
start = 1502
frames = 101
clips = ["replay-impact"]
transition = "cut"

[[shot]]
id = "end"
layout = "end"
start = 1603
frames = 317
clips = []
overlay = "v0.1 FIRST FLIGHT"
transition = "slam"

# The 15-second edit: [shot, first frame, frames]. It keeps the continuous
# HUD-to-cockpit reveal and the whole replay sequence. Its music is rebuilt:
# the same kick on its own replay cut, two bars, then the stinger.
[cutdown]
segments = [["boot", 0, 90], ["launch", 0, 101], ["cockpit", 0, 302], ["replay-alt", 0, 51], ["replay-freeze", 0, 25], ["replay-rewind", 0, 25], ["replay-impact", 0, 101], ["end", 0, 205]]

