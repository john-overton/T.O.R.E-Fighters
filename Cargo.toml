[workspace]
members = ["crates/tore-app", "crates/tore-formats", "crates/tore-extract"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.91.1"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# Keep symbols and debug assertions while optimizing per-pixel flight/UI loops.
[profile.dev.package.tore-app]
opt-level = 2
