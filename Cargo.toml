[workspace]
members = ["crates/tore-app", "crates/tore-formats", "crates/tore-extract", "crates/tore-sim", "crates/tore-input", "crates/tore-input-native", "crates/tore-diagnostics-native", "crates/tore-replay"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.91.1"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# Keep symbols and debug assertions while optimizing per-pixel flight/UI loops.
[profile.dev.package.tore-sim]
opt-level = 2

[profile.dev.package.tore-app]
opt-level = 2

# Keep matching release symbols for startup/crash diagnosis.
[profile.release]
debug = 1
